name: Validate Deployment
on: 
  push: 
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
    types: [opened, reopened, edited]
  workflow_dispatch:
jobs:
  pmd-scan:
    runs-on: ubuntu-latest
    container:
      image: salesforce/cli:latest-rc-slim
    steps:
      - name: PMD scan
        uses: ./github/workflows/pmd.yml
        run: echo "PMD Scan status ${{ outputs.pmd_scan_status }}"

