name: Validate Deployment
on: 
  workflow_dispatch:
  push: 
    branches:
      - main
      - dev
jobs:
  pmd-scan:
    runs-on: ubuntu-latest
    #container:
    #  image: salesforce/cli:latest-rc-slim
    outputs: 
      var: ${{ steps.result.outputs.pmd_scan_status }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev
      - name: PMD scan
        id: result
        run: echo " pmd_scan_status = 'first yml' " >> GITHUB-OUTPUT
        #uses: ./github/workflows/pmd.yml
      - name: Print PMD scan status
        run: echo "PMD Scan status ${{ outputs.var }}"

