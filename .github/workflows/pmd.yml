name: PMD Scan
on: 
  workflow_call:
    outputs:
      pmd_scan_status:
        description: This is the status of pmd scan result
        value: ${{ jobs.pmd.outputs.fail-pmd-result }}
jobs:
  pmd:
    runs-on: ubuntu-latest
    container: 
    image: salesforce/cli:latest-rc-slim
    outputs:
      fail-pmd-result: ${{ steps.result.outputs.pmd-result }}
    steps:
    - name: Checkout code
      run: actions/checkout@v4
    - name: Install SF Scanner
      run: sf plugins install @salesforce/sfdx-scanner@v4.2.0
    - name: ESLINT scan
      id: pmd
      continue-on-error: 'true'
      run: sf scanner run --target ./ --config ruleset.xml -f table --engine pmd --normalize-severity --severity-threshold 2
    - name: Capture failure status of PMD scan
      if: ${{ failure() && steps.pmd.conclusion == 'failure' }}
      id: result
      run: echo "pmd-result = 'Failed' " >> $GITHUB_OUTPUT
    - name: Capture success status of PMD scan
      if: ${{ failure() && steps.pmd.conclusion == 'success' }}
      id: result
      run: echo "pmd-result = 'Success' " >> $GITHUB_OUTPUT