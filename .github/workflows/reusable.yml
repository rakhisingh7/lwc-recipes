name: Reusable Deployment
on: 
  workflow_dispatch:

  push: 
    branches:
      - main
      - dev
jobs:
  pmd-scan:
    runs-on: ubuntu-latest
    #container:
    #  image: salesforce/cli:latest-rc-slim
    steps:
      - name: PMD scan
        uses: ./github/workflows/pmd.yml

  display-reusable-output:
    runs-on: ubuntu-latest
    steps:
      - name: Print PMD scan status
        run: echo "${{ needs.pmd-scan.outputs.pmd_scan_status }}"
  
